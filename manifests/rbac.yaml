apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logging-lab-reader
  namespace: notes-lab
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logging-lab-reader
  namespace: notes-lab
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: logging-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logging-lab-reader
