apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging-lab
resources:
  - manifests/namespace.yaml
  - manifests/serviceaccount.yaml
  - manifests/workloads.yaml
configMapGenerator:
